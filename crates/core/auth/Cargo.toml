[package]
name = "squirrel-mcp-auth"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Authentication and JWT handling for Squirrel MCP"
repository = "https://github.com/ecoPrimals/squirrel"
keywords = ["ecoprimals", "ai", "mcp", "json-rpc"]
categories = ["development-tools"]

[features]
default = ["delegated-jwt"]
delegated-jwt = []
## local-jwt and http-auth removed (stadial gate: ring/reqwest lockfile ghosts eliminated)
# Integration tests disabled — API has changed, tests need rewrite
integration-tests = []

[dependencies]
universal-constants = { path = "../../universal-constants", version = "0.1.0" }
universal-patterns = { path = "../../universal-patterns", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

base64.workspace = true
zeroize.workspace = true
[dev-dependencies]
tokio-test.workspace = true
temp-env.workspace = true
tempfile.workspace = true
[lints]
workspace = true
